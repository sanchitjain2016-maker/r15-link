name: R15Link
options:
  bundleIdPrefix: com.sanchit.r15link
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.7"
    CURRENT_PROJECT_VERSION: "6"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.sanchit.r15link
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
targets:
  R15Link:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: R15 Link
        CFBundleShortVersionString: "0.7"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: "Connects to your Yamaha R15 M over Bluetooth to show live ride data and hold the link."
        NSBluetoothPeripheralUsageDescription: "Connects to your Yamaha R15 M over Bluetooth."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
